services:

  # =====================================================
  # PostgreSQL
  # =====================================================

  postgres:
    image: postgres:17
    container_name: microservices-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - microservices-network


  # =====================================================
  # MongoDB
  # =====================================================

  mongodb:
    image: mongo:8
    container_name: microservices-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - microservices-network


  # =====================================================
  # Redis
  # =====================================================

  redis:
    image: redis:7
    container_name: microservices-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - redis123

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - microservices-network


  # =====================================================
  # Kafka - KRaft mode
  # =====================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: microservices-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - microservices-network


  # =====================================================
  # pgAdmin
  # =====================================================

  pgadmin:
    image: dpage/pgadmin4
    container_name: microservices-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - microservices-network


  # =====================================================
  # Mongo Express
  # =====================================================

  mongo-express:
    image: mongo-express
    container_name: microservices-mongo-express
    restart: unless-stopped

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123

    ports:
      - "8081:8081"

    depends_on:
      - mongodb

    networks:
      - microservices-network


# =====================================================
# Volumes
# =====================================================

volumes:

  postgres_data:

  mongodb_data:

  redis_data:

  kafka_data:


# =====================================================
# Network
# =====================================================

networks:

  microservices-network:
    driver: bridge